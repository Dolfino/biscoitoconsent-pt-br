name: Consent platform image

on:
  push:
    branches: [master]
    paths:
      - platform/**
      - dist/**
      - .dockerignore
      - .github/workflows/platform-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: consent-platform-image
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: platform
        run: npm ci

      - name: Validate platform
        working-directory: platform
        run: |
          npm run typecheck
          npm test
          npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/Dockerfile
          push: true
          tags: |
            ghcr.io/dolfino/biscoitoconsent-platform:latest
            ghcr.io/dolfino/biscoitoconsent-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
